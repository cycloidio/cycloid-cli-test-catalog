---
definitions:
  tasks:
    - &task-merge-stack-and-config
      task: merge-stack-and-config
      config:
        platform: linux
        image_resource:
          type: registry-image
          source:
            repository: cycloid/cycloid-toolkit
            tag: latest
        run:
          path: /usr/bin/merge-stack-and-config
        inputs:
        - name: stack
          path: "stack"
        - name: config
          path: "config"
        outputs:
        - name: merged_stack
          path: "merged_stack"

      params:
        CONFIG_PATH:  '($ .config_root $)/terraform/'
        STACK_PATH: '($ .stack_path $)/terraform/'
        MERGE_OUTPUT_PATH: "merged_stack/"

resource_types:
- name: terraform
  type: registry-image
  source:
    repository: cycloid/terraform-resource
    tag: 'latest'

resources:
- name: tfstate
  type: terraform
  icon: terraform
  source:
    backend_type: http
    backend_config:
      address: '($ .api_url $)/inventory?jwt=($ .inventory_jwt $)'
      skip_cert_verification: true
    env_name: ($ .environment $)

# The Terraform stack (will be merged with the config).
- name: stack
  type: git
  icon: github-circle
  source:
    uri: ($ .scs_url $)
    branch: ($ .scs_branch $)
    ($- if eq .scs_cred_type "basic_auth" $)
    username: ((($ .scs_cred_path $).username))
    password: ((($ .scs_cred_path $).password))
    ($- end $)
    ($- if eq .scs_cred_type "ssh" $)
    private_key: ((($ .scs_cred_path $).ssh_key))
    ($- end $)
    paths:
    - ($ .stack_path $)/terraform/*

- name: config
  type: git
  icon: github-circle
  source:
    uri: ($ .cr_url $)
    branch: ($ .cr_branch $)
    ($- if eq .cr_cred_type "basic_auth" $)
    username: ((($ .cr_cred_path $).username))
    password: ((($ .cr_cred_path $).password))
    ($- end $)
    ($- if eq .cr_cred_type "ssh" $)
    private_key: ((($ .cr_cred_path $).ssh_key))
    ($- end $)
    paths:
    - '($ .config_root $)/terraform/*'

jobs:
- name: hello-world
  serial: true
  serial_groups: [terraform]
  max_in_flight: 1
  build_logs_to_retain: 10
  plan:
  - do:
    - get: stack
      trigger: true
    - get: config
      trigger: true
    - task: hello-world
      config:
        platform: linux
        image_resource:
          type: registry-image
          source:
            repository: cycloid/cycloid-toolkit
            tag: latest
        run:
          path: /bin/bash
          args:
          - -ec
          - |
            echo "((var))" > msg.txt
        inputs:
        - name: stack
          path: "stack"
        - name: config
          path: "config"
        outputs:
        - name: message
          path: "msg.txt"

- name: terraform-plan
  serial: true
  serial_groups: [terraform]
  max_in_flight: 1
  build_logs_to_retain: 10
  plan:
  - do:
    - get: stack
      trigger: true
    - get: config
      trigger: true
    - *task-merge-stack-and-config
    - put: tfstate
      params:
        plan_only: true
        terraform_source: merged_stack/

- name: terraform-apply
  serial: true
  serial_groups: [terraform]
  build_logs_to_retain: 10
  plan:
  - do:
    - get: stack
      trigger: false
      passed:
      - terraform-plan
    - get: config
      trigger: false
      passed:
      - terraform-plan
    - get: tfstate
      trigger: false
      passed:
      - terraform-plan
    - *task-merge-stack-and-config
    - put: tfstate
      params:
        plan_run: true
        terraform_source: merged_stack/

- name: terraform-destroy
  serial: true
  serial_groups: [terraform]
  build_logs_to_retain: 10
  plan:
  - do:
    - get: stack
      trigger: false
    - get: config
      trigger: false
    - *task-merge-stack-and-config
    - put: tfstate
      params:
        action: destroy
        terraform_source: merged_stack/
      get_params:
        action: destroy

# Organize jobs into groups.
# See: https://concourse-ci.org/pipelines.html#schema.pipeline.groups
groups:
- name: overview
  jobs:
  - hello-world
  - terraform-plan
  - terraform-apply
- name: destroy
  jobs:
  - terraform-destroy
