jobs:
- name: job-hello-world
  build_logs_to_retain: 3
  plan:
  - task: hello-world
    config:
        platform: linux
        image_resource:
            type: registry-image
            source: {repository: busybox, tag: latest}
        run:
          path: /bin/sh
          args:
          - -ec
          - |
            echo text_area
            echo ((text_area))
            echo text_area_required
            echo ((text_area_required))
            echo dropdown_arrays
            echo ((dropdown_arrays))
            echo dropdown
            echo ((dropdown))
            echo dropdown_required
            echo ((dropdown_required))
            echo dropdown_required_default
            echo ((dropdown_required_default))
            echo auto_complete
            echo ((auto_complete))
            echo auto_complete_required
            echo ((auto_complete_required))
            echo auto_complete_required_default_string
            echo ((auto_complete_required_default_string))
            echo auto_complete_required_default_array
            echo ((auto_complete_required_default_array))
